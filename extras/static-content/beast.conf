server {
    listen [::]:8080;
    listen 8080;
    server_name _;

    access_log /dev/stdout;
    error_log /dev/stderr warn;
    server_tokens off;

    location ~ "^/static/(?<chall>[a-z0-9][a-z0-9_.-]{0,127})/static/(?<asset>[A-Za-z0-9_-][A-Za-z0-9._-]*(?:/[A-Za-z0-9_-][A-Za-z0-9._-]*)*)$" {
        alias /beast/$chall/static/$asset;
        disable_symlinks on;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        return 404;
    }
}
