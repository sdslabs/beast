services:
  app:
    build: .
    ports:
      - "${APP_PORT}:80"
    environment:
      MYSQL_database: my_db
      MYSQL_username: my_user
      MYSQL_password: my_password
    depends_on:
      - mysql

  mysql:
    image: mysql:8
    environment:
      MYSQL_DATABASE: my_db
      MYSQL_USER: my_user
      MYSQL_PASSWORD: my_password
      MYSQL_ROOT_PASSWORD: root_password
