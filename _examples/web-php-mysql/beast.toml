[author]
name = "fristonio"
email = "contact+fristonio@sdslabs.co.in"
ssh_key = "ssh-rsa AAAAB3NzaC1y"

[challenge.metadata]
name = "web-php-mysql"
flag = "CTF{sample_flag}"
type = "web:php:8.2:cli"
description = "A PHP 8.2 web challenge interacting with MySQL database."
difficulty = "medium"
points = 200
maxAttemptLimit = 10
tags = ["web", "php", "sql"]

[[challenge.metadata.hints]]
text = "simple_hint_1"
points = 10

[[challenge.metadata.hints]]
text = "simple_hint_2"
points = 20

[challenge.env]
apt_deps = ["gcc"]
setup_scripts = ["setup.sh"]
ports = [10004]
web_root = "challenge"
default_port = 10004

[resource]
cpu_shares = 1024
memory_limit = 536870912
pids_limit = 100
cpuslimit = 0.25
