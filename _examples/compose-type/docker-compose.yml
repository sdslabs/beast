services:
  app:
    build: .
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.125
    pids_limit: 50
    ports:
      - "${APP_PORT}:80"
    environment:
      MYSQL_HOST: mysql
      MYSQL_DATABASE: my_db
      MYSQL_USER: my_user
      MYSQL_PASSWORD: my_password
    depends_on:
      - mysql

  mysql:
    image: mysql:8
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, SETGID, SETUID]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.125
    pids_limit: 50
    environment:
      MYSQL_DATABASE: my_db
      MYSQL_USER: my_user
      MYSQL_PASSWORD: my_password
      MYSQL_ROOT_PASSWORD: root_password
