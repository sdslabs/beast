[author]
name = "fristonio"
email = "contact+fristonio@sdslabs.co.in"
ssh_key = "ssh-rsa AAAAB3NzaC1y"

[challenge.metadata]
name = "web-php"
flag = "BACKDOOR{SAMPLE_WEB_FLAG}"
type = "web:php:8.2:cli"
description = "A simple PHP 8.2 web challenge served via PHP built-in CLI server."
difficulty = "easy"
maxAttemptLimit = 3
points = 200
tags = ["web", "php"]

[[challenge.metadata.hints]]
text = "simple_hint_1"
points = 10

[[challenge.metadata.hints]]
text = "simple_hint_2"
points = 20

[challenge.env]
ports = [10002]
web_root = "challenge"
default_port = 10002

[resource]
cpu_shares = 1024
memory_limit = 536870912
pids_limit = 100
cpuslimit = 0.25
