[author]
name = "fristonio"
email = "contact+fristonio@sdslabs.co.in"

[challenge.metadata]
name = "service"
flag = "CTF{sample_flag}"
type = "service"
points = 100
maxAttemptLimit = 10

[[challenge.metadata.hints]]
text = "simple_hint_1"
points = 10

[[challenge.metadata.hints]]
text = "simple_hint_2"
points = 20


[challenge.env]
apt_deps = ["gcc", "socat"]
setup_scripts = ["setup.sh"]
service_path = "pwn"
ports = [10004]
default_port = 10004

[resource]
cpu_shares = 512
memory_limit = 536870912
pids_limit = 100
cpuslimit = 0.25
