version: '3.8'

# Primary instance service must be named `ssh` (core.SSH_CONTAINER_COMPOSE).

services:
  ssh:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${INSTANCE_PORT}:80"
      - "${INSTANCE_SSH_PORT}:22"
    environment:
      - DB_HOST=db
      - DB_USER=challenge
      - DB_PASS=challengepass
      - DB_NAME=ctf
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: mysql:5.7
    environment:
      - MYSQL_ROOT_PASSWORD=rootpass
      - MYSQL_DATABASE=ctf
      - MYSQL_USER=challenge
      - MYSQL_PASSWORD=challengepass
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped
