basePath: /
definitions:
  api.AdminInstanceResponse:
    properties:
      challenge_name:
        type: string
      container_id:
        type: string
      created_at:
        type: string
      deployment_type:
        type: string
      expires_at:
        type: string
      hosted_address:
        type: string
      instance_id:
        type: string
      port:
        type: integer
      ttl_seconds:
        type: integer
      user_id:
        type: string
      username:
        type: string
    type: object
  api.AvailableImagesResp:
    properties:
      images:
        example:
        - ubuntu:24.04
        - debian:bookworm
        items:
          type: string
        type: array
      message:
        example: Available Base images.
        type: string
    type: object
  api.Challenge:
    properties:
      additionalLinks:
        example:
        - https://link1.example
        - https://link2.example
        items:
          type: string
        type: array
      assets:
        example:
        - image1.png
        - zippy.zip
        items:
          type: string
        type: array
      category:
        example: web
        type: string
      createdAt:
        type: string
      deployedLink:
        example: beast.sdslabs.co or ip:port
        type: string
      deployedStatus:
        example: deployed
        type: string
      description:
        example: A simple web challenge
        type: string
      difficulty:
        example: easy
        type: string
      hints:
        items:
          $ref: '#/definitions/api.HintInfo'
        type: array
      id:
        example: 0
        type: integer
      instanceExpiration:
        example: 300
        type: integer
      instanced:
        example: false
        type: boolean
      maxAttemptLimit:
        example: 5
        type: integer
      name:
        example: Web Challenge
        type: string
      points:
        example: 50
        type: integer
      preRequisite:
        example:
        - chall1
        - chall2
        items:
          type: string
        type: array
      previousTries:
        example: 3
        type: integer
      solveStatus:
        example: true
        type: boolean
      solvesNumber:
        example: 100
        type: integer
      tags:
        example:
        - pwn
        - misc
        items:
          type: string
        type: array
    type: object
  api.ChallengeMetadata:
    properties:
      createdAt:
        type: string
      deployedStatus:
        example: deployed
        type: string
      difficulty:
        example: easy
        type: string
      id:
        example: 0
        type: integer
      instanceExpiration:
        example: 300
        type: integer
      instanced:
        example: false
        type: boolean
      name:
        example: Web Challenge
        type: string
      points:
        example: 50
        type: integer
      preRequisite:
        example:
        - chall1
        - chall2
        items:
          type: string
        type: array
      solveStatus:
        example: true
        type: boolean
      solvesNumber:
        example: 100
        type: integer
      tags:
        example:
        - pwn
        - misc
        items:
          type: string
        type: array
    type: object
  api.ChallengePreviewResp:
    properties:
      additionalLinks:
        example:
        - https://link1.example
        - https://link2.example
        items:
          type: string
        type: array
      assets:
        example:
        - image1.png
        - zippy.zip
        items:
          type: string
        type: array
      category:
        example: web
        type: string
      deployedLink:
        example: beast.sdslabs.co
        type: string
      description:
        example: A simple web challenge
        type: string
      maxAttemptLimit:
        example: 5
        type: integer
      name:
        example: Web Challenge
        type: string
      points:
        example: 50
        type: integer
      ports:
        example:
        - 3001
        - 3002
        items:
          type: integer
        type: array
      preRequisite:
        example:
        - web-php
        - simple
        items:
          type: string
        type: array
      tags:
        example:
        - pwn
        - misc
        items:
          type: string
        type: array
    type: object
  api.ChallengeSolveResp:
    properties:
      category:
        example: bare
        type: string
      id:
        example: 4
        type: integer
      name:
        example: Web Challenge
        type: string
      points:
        example: 50
        type: integer
      solvedAt:
        type: string
      tags:
        example:
        - pwn
        - misc
        items:
          type: string
        type: array
    type: object
  api.ChallengeStatusResp:
    properties:
      name:
        example: Web Challenge
        type: string
      status:
        example: deployed
        type: string
      updated_at:
        example: "2018-12-31T22:20:08.948096189+05:30"
        type: string
    type: object
  api.CompetitionInfoResp:
    properties:
      about:
        example: This is a CTF competition
        type: string
      ending_time:
        type: string
      logo_url:
        type: string
      name:
        example: fristonio
        type: string
      prizes:
        example: 1st and 2nd place winners will get $10K
        type: string
      starting_time:
        type: string
      timezone:
        example: 'Asia/Calcutta: UTC +05:30'
        type: string
    type: object
  api.ExecChallengeRequest:
    properties:
      command:
        items:
          type: string
        type: array
      instance_id:
        type: string
      timeout_seconds:
        type: integer
    type: object
  api.ExecChallengeResponse:
    properties:
      exit_code:
        type: integer
      stderr:
        type: string
      stdout:
        type: string
      truncated:
        type: boolean
    type: object
  api.HTTPAuthorizeResp:
    properties:
      message:
        example: Response message
        type: string
      role:
        example: author
        type: string
      token:
        example: YOUR_AUTHENTICATION_TOKEN
        type: string
    type: object
  api.HTTPErrorResp:
    properties:
      error:
        example: Error occured while veifying the challenge.
        type: string
    type: object
  api.HTTPPlainResp:
    properties:
      message:
        example: Messsage in response to your request
        type: string
    type: object
  api.HintInfo:
    properties:
      id:
        type: integer
      points:
        type: integer
    type: object
  api.HintResponse:
    properties:
      description:
        example: This is a hint
        type: string
      points:
        example: 10
        type: integer
    type: object
  api.InstanceResponse:
    properties:
      challenge_name:
        type: string
      created_at:
        type: string
      expires_at:
        type: string
      hosted_address:
        type: string
      instance_id:
        type: string
      port:
        type: integer
      ttl_seconds:
        type: integer
    type: object
  api.LogsInfoResp:
    properties:
      stderr:
        example: '[ERROR] Challenge deployment failed.'
        type: string
      stdout:
        example: '[INFO] Challenge is starting to deploy'
        type: string
    type: object
  api.SubmissionResp:
    properties:
      chall_id:
        example: 3
        type: integer
      cheating:
        example: false
        type: boolean
      flag:
        example: flag{@#$}
        type: string
      name:
        example: Web Challenge
        type: string
      solvedAt:
        type: string
      success:
        example: true
        type: boolean
      user_id:
        example: 3
        type: integer
      username:
        example: fristonio
        type: string
    type: object
  api.TagInfoResp:
    properties:
      tags:
        items:
          type: string
        type: array
    type: object
  api.UserCountResp:
    properties:
      user_count:
        type: integer
    type: object
  api.UserResp:
    properties:
      challenges:
        items:
          $ref: '#/definitions/api.ChallengeSolveResp'
        type: array
      email:
        example: fristonio@gmail.com
        type: string
      id:
        example: 5
        type: integer
      rank:
        example: 15
        type: integer
      role:
        example: author
        type: string
      score:
        example: 750
        type: integer
      status:
        example: 0
        type: integer
      username:
        example: CTF is live now!
        type: string
    type: object
  api.UserSolveResp:
    properties:
      correct:
        example: true
        type: boolean
      flag:
        example: flag{example_flag}
        type: string
      id:
        example: 5
        type: integer
      solvedAt:
        type: string
      username:
        example: fristonio
        type: string
    type: object
  api.UsersResp:
    properties:
      email:
        example: fristonio@gmail.com
        type: string
      id:
        example: 5
        type: integer
      rank:
        example: 15
        type: integer
      role:
        example: author
        type: string
      score:
        example: 750
        type: integer
      status:
        example: 0
        type: integer
      username:
        example: CTF is live now!
        type: string
    type: object
  api.UsersStatisticsResp:
    properties:
      banned_users:
        example: 60
        type: integer
      total_registered_users:
        example: 120
        type: integer
      unbanned_users:
        example: 60
        type: integer
    type: object
  database.TimeSeries:
    properties:
      score:
        example: 750
        type: integer
      timestamp:
        example: 2018-12-31T22:20:08
        type: string
    type: object
  database.UserLeaderboardResp:
    properties:
      id:
        example: 5
        type: integer
      rank:
        example: 15
        type: integer
      score:
        example: 750
        type: integer
      timeSeriesData:
        items:
          $ref: '#/definitions/database.TimeSeries'
        type: array
      username:
        example: ABCD
        type: string
    type: object
info:
  contact:
    email: contact@sdslabs.co.in
    name: SDSLabs
    url: https://chat.sdslabs.co
  description: Authenticated API for Beast CTF challenge deployment and competition
    services.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  title: Beast API
  version: "0.2"
paths:
  /api/admin/freezeLeaderboard:
    post:
      consumes:
      - application/json
      description: freezes the user leaderboard on demand.
      parameters:
      - description: Bearer
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.UserResp'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.HTTPErrorResp'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.HTTPErrorResp'
      summary: Freeze user leaderboard
      tags:
      - info
  /api/admin/instances:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/api.AdminInstanceResponse'
            type: array
      security:
      - ApiKeyAuth: []
      summary: List all active instances
      tags:
      - admin
  /api/admin/instances/{instance_id}:
    delete:
      parameters:
      - description: Instance ID
        in: path
        name: instance_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.HTTPPlainResp'
      security:
      - ApiKeyAuth: []
      summary: Delete an instance by ID
      tags:
      - admin
    get:
      parameters:
      - description: Instance ID
        in: path
        name: instance_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.AdminInstanceResponse'
      security:
      - ApiKeyAuth: []
      summary: Get an instance by ID
      tags:
      - admin
  /api/admin/instances/challenge/{challenge_name}:
    delete:
      parameters:
      - description: Challenge name
        in: path
        name: challenge_name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.HTTPPlainResp'
      security:
      - ApiKeyAuth: []
      summary: Delete all instances for a challenge
      tags:
      - admin
  /api/admin/instances/user/{user_id}:
    delete:
      parameters:
      - description: User ID
        in: path
        name: user_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.HTTPPlainResp'
      security:
      - ApiKeyAuth: []
      summary: Delete all instances owned by a user
      tags:
      - admin
  /api/admin/leaderboard:
    get:
      consumes:
      - application/json
      description: Returns admin leaderboard of all users
      parameters:
      - description: Bearer
        in: header
        name: Authorization
        required: true
        type: string
      - description: Page number
        in: query
        name: page
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.UserResp'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.HTTPErrorResp'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.HTTPErrorResp'
      summary: Returns admin leaderboard
      tags:
      - info
  /api/admin/statistics:
    get:
      consumes:
      - application/json
      description: returns statistics of users in competition (currently limited to
        ban/unban status of users)
      parameters:
      - description: Bearer
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.UsersStatisticsResp'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.HTTPErrorResp'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.HTTPErrorResp'
      summary: statistics of users in competition
      tags:
      - info
  /api/admin/submissions:
    get:
      consumes:
      - application/json
      description: Handles submissions made by the user
      parameters:
      - description: Bearer
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.SubmissionResp'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.HTTPErrorResp'
      summary: Handles submissions made by the user
      tags:
      - info
  /api/admin/unfreezeLeaderboard:
    post:
      consumes:
      - application/json
      description: unfreezes the user leaderboard on demand.
      parameters:
      - description: Bearer
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.UserResp'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.HTTPErrorResp'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.HTTPErrorResp'
      summary: Unfreeze user leaderboard
      tags:
      - info
  /api/admin/users/{action}/{id}:
    post:
      consumes:
      - application/json
      description: Ban/Unban/Hide/Unhide a user based on his user id. This operation
        can only be done by admins
      parameters:
      - description: Action to perform Ban/Unban/Hide/Unhide
        in: query
        name: action
        required: true
        type: string
      - description: Id of user
        in: query
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.ChallengeStatusResp'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.HTTPPlainResp'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.HTTPPlainResp'
      summary: Ban/Unban/Hide/Unhide a user based on his id and the action provided.
      tags:
      - admin
  /api/config/challenge-info:
    post:
      consumes:
      - application/json
      description: Updates challenge info in the database, located at ~/.beast/beast.db.
      parameters:
      - description: Challenge Name
        in: formData
        name: name
        required: true
        type: string
      - description: Challenge's description
        in: formData
        name: desc
        type: string
      - description: Challenge's points
        in: formData
        name: points
        type: string
      - description: Challenge's flag
        in: formData
        name: flag
        type: string
      - description: Challenge's tags
        in: formData
        name: tags
        type: string
      - description: Challenge's ports
        in: formData
        name: ports
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.HTTPPlainResp'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.HTTPPlainResp'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.HTTPErrorResp'
      summary: Updates challenge info in the database, located at ~/.beast/beast.db.
      tags:
      - config
  /api/info/challenge/{name}:
    get:
      consumes:
      - application/json
      description: Returns all information about the challenges by the challenge name.
      parameters:
      - description: Bearer
        in: header
        name: Authorization
        required: true
        type: string
      - description: Name of challenge
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.Challenge'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.HTTPErrorResp'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.HTTPErrorResp'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.HTTPErrorResp'
      summary: Returns all information about the challenges.
      tags:
      - info
  /api/info/challenges:
    get:
      consumes:
      - application/json
      description: Returns information about all the challenges present in the database
        with and without filters.
      parameters:
      - description: Filter parameter by which challenges are filtered
        in: query
        name: filter
        type: string
      - description: Value of filtered parameter
        in: query
        name: value
        type: string
      - description: Bearer
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/api.ChallengeMetadata'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.HTTPErrorResp'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.HTTPErrorResp'
      summary: Returns metadata about all challenges with and without filters.
      tags:
      - info
  /api/info/competition-info:
    get:
      consumes:
      - application/json
      description: returns various information about the competition which are used
        to control competition
      parameters:
      - description: Bearer
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.CompetitionInfoResp'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.HTTPErrorResp'
      summary: returns competition info
      tags:
      - info
  /api/info/download:
    get:
      consumes:
      - application/json
      parameters:
      - description: Bearer
        in: header
        name: Authorization
        required: true
        type: string
      - description: The name of the challenge to get the logs for.
        in: query
        name: challenge
        type: string
      - description: The name of the static asset requested.
        in: query
        name: asset
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.LogsInfoResp'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.HTTPPlainResp'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.HTTPPlainResp'
      tags:
      - info
  /api/info/hint/{hintID}:
    get:
      parameters:
      - description: Hint ID
        in: path
        name: hintID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.HintResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.HTTPErrorResp'
      security:
      - ApiKeyAuth: []
      summary: Read or purchase a challenge hint
      tags:
      - info
    post:
      parameters:
      - description: Hint ID
        in: path
        name: hintID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.HintResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.HTTPErrorResp'
      security:
      - ApiKeyAuth: []
      summary: Read or purchase a challenge hint
      tags:
      - info
  /api/info/images/available:
    get:
      consumes:
      - application/json
      description: Returns all the available base images  which can be used for challenge
        creation as the base OS for challenge.
      parameters:
      - description: Bearer
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.AvailableImagesResp'
      summary: Gives all the base images that can be used while creating a beast challenge,
        this is a constant specified in beast global config
      tags:
      - info
  /api/info/leaderboard:
    get:
      consumes:
      - application/json
      description: Returns leaderboard of all users
      parameters:
      - description: Bearer
        in: header
        name: Authorization
        required: true
        type: string
      - description: Page number
        in: query
        name: page
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.UserResp'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.HTTPErrorResp'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.HTTPErrorResp'
      summary: Returns leaderboard
      tags:
      - info
  /api/info/leaderboard-graph:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/database.UserLeaderboardResp'
            type: array
      security:
      - ApiKeyAuth: []
      summary: Return leaderboard score history
      tags:
      - info
  /api/info/submissions/challenge/{challenge_id}:
    get:
      consumes:
      - application/json
      description: Returns all user attempts for a given challenge.
      parameters:
      - description: Challenge ID
        in: path
        name: challenge_id
        required: true
        type: integer
      - description: Bearer
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/api.UserSolveResp'
            type: array
        "400":
