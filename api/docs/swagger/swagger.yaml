          schema:
            $ref: '#/definitions/api.HTTPPlainResp'
      security:
      - ApiKeyAuth: []
      summary: Resets beast local copy of remote git repository.
      tags:
      - remote
  /api/remote/sync:
    post:
      description: Syncs beasts local challenges database with the remote git repository(hack)
        the local copy of the challenge database is located at $HOME/.beast/remote/$REMOTE_NAME.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.HTTPPlainResp'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.HTTPPlainResp'
      security:
      - ApiKeyAuth: []
      summary: Syncs beast's local copy of remote git repository for challenges.
      tags:
      - remote
  /api/status/all:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/api.ChallengeStatusResp'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.HTTPPlainResp'
      security:
      - ApiKeyAuth: []
      summary: List challenges with their deployment status
      tags:
      - status
  /api/status/all/{filter}:
    get:
      description: This returns the challenges in the status provided, along with
        their name and last updated time.
      parameters:
      - description: Deployment status such as deployed or undeployed
        in: path
        name: filter
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/api.ChallengeStatusResp'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.HTTPPlainResp'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.HTTPPlainResp'
      security:
      - ApiKeyAuth: []
      summary: Returns challenge deployment status from the beast database for the
        challenges which matches the stauts according to filter.
      tags:
      - status
  /api/status/challenge/{name}:
    get:
      description: Returns challenge deployment status from the beast database, for
        those challenges which are not present the status is Not Available.
      parameters:
      - description: Name of the challenge
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.ChallengeStatusResp'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.HTTPPlainResp'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.HTTPPlainResp'
      security:
      - ApiKeyAuth: []
      summary: Returns challenge deployment status from the beast database.
      tags:
      - status
  /api/submit/challenge:
    post:
      consumes:
      - application/x-www-form-urlencoded
      - multipart/form-data
      description: Returns success or error response based on the flag submitted.
        Also, the flag will not be submitted if it was previously submitted
      parameters:
      - description: ID of challenge
        in: formData
        name: chall_id
        required: true
        type: string
      - description: Flag for the challenge
        in: formData
        name: flag
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.FlagSubmitResp'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.HTTPErrorResp'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.HTTPErrorResp'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.HTTPErrorResp'
      security:
      - ApiKeyAuth: []
      summary: Verifies and creates an entry in the database for successful submission
        of flag for a challenge.
      tags:
      - Submit
  /auth/login:
    post:
      consumes:
      - application/x-www-form-urlencoded
      - multipart/form-data
      description: JWT can be received by signing in
      parameters:
      - description: Username
        in: formData
        name: username
        required: true
        type: string
      - description: Password
        in: formData
        name: password
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.HTTPAuthorizeResp'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.HTTPPlainResp'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.HTTPPlainResp'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.HTTPPlainResp'
      summary: Handles signin and token production
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/x-www-form-urlencoded
      - multipart/form-data
      description: Signup route for the user
      parameters:
      - description: User's name
        in: formData
        name: name
        type: string
      - description: Username
        in: formData
        name: username
        required: true
        type: string
      - description: Password
        in: formData
        name: password
        required: true
        type: string
      - description: User's email id
        in: formData
        name: email
        required: true
        type: string
      - description: User's ssh-key
        in: formData
        name: ssh-key
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.HTTPPlainResp'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.HTTPPlainResp'
        "406":
          description: Not Acceptable
          schema:
            $ref: '#/definitions/api.HTTPPlainResp'
      summary: Signup for the user
      tags:
      - auth
  /auth/reset-password:
    post:
      consumes:
      - application/x-www-form-urlencoded
      - multipart/form-data
      description: Resets password for the user
      parameters:
      - description: New Password
        in: formData
        name: new_pass
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.HTTPPlainResp'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.HTTPPlainResp'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.HTTPPlainResp'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.HTTPPlainResp'
      security:
      - ApiKeyAuth: []
      summary: Resets password for the user
      tags:
      - auth
  /auth/send-otp:
    post:
      consumes:
      - application/x-www-form-urlencoded
      - multipart/form-data
      parameters:
      - description: Email address
        in: formData
        name: email
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.HTTPPlainResp'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.HTTPErrorResp'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.HTTPErrorResp'
      summary: Send a registration verification code
      tags:
      - auth
  /auth/send-otp-forget:
    post:
      consumes:
      - application/x-www-form-urlencoded
      - multipart/form-data
      parameters:
      - description: Email address
        in: formData
        name: email
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.HTTPPlainResp'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.HTTPErrorResp'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.HTTPErrorResp'
      summary: Send a password recovery code
      tags:
      - auth
  /auth/verify-otp:
    post:
      consumes:
      - application/x-www-form-urlencoded
      - multipart/form-data
      parameters:
      - description: Email address
        in: formData
        name: email
        required: true
        type: string
      - description: Six-digit email code
        in: formData
        name: otp
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.HTTPPlainResp'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.HTTPErrorResp'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.HTTPErrorResp'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.HTTPErrorResp'
      summary: Verify a registration code
      tags:
      - auth
  /auth/verify-otp-forget:
    post:
      consumes:
      - application/x-www-form-urlencoded
      - multipart/form-data
      parameters:
      - description: Email address
        in: formData
        name: email
        required: true
        type: string
      - description: Six-digit email code
        in: formData
        name: otp
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.HTTPAuthorizeResp'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.HTTPErrorResp'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.HTTPErrorResp'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.HTTPErrorResp'
      summary: Verify a password recovery code
      tags:
      - auth
securityDefinitions:
  ApiKeyAuth:
    description: Paste the complete header value, including the Bearer prefix.
    in: header
    name: Authorization
    type: apiKey
