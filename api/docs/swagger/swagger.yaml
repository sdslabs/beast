basePath: /
definitions:
  api.AdminInstanceResponse:
    properties:
      challenge_name:
        type: string
      container_id:
        type: string
      created_at:
        type: string
      deployment_type:
        type: string
      expires_at:
        type: string
      hosted_address:
        type: string
      instance_id:
        type: string
      port:
        items:
          type: integer
        type: array
      ttl_seconds:
        type: integer
      user_id:
        type: string
      username:
        type: string
    type: object
  api.Challenge:
    properties:
      additionalLinks:
        example:
        - '[''http://link1.abc:8080'''
        - '''http://link2.abc:8081'']'
        items:
          type: string
        type: array
      assets:
        example:
        - '[''image1.png'''
        - ' ''zippy.zip'']'
        items:
          type: string
        type: array
      category:
        example: web
        type: string
      createdAt:
        type: string
      deployedLink:
        example: beast.sdslabs.co or ip:port
        type: string
      deployedStatus:
        example: deployed
        type: string
      description:
        example: A simple web challenge
        type: string
      difficulty:
        example: easy
        type: string
      hints:
        items:
          $ref: '#/definitions/api.HintInfo'
        type: array
      id:
        example: 0
        type: integer
      instanceExpiration:
        example: 300
        type: integer
      instanced:
        example: false
        type: boolean
      maxAttemptLimit:
        example: 5
        type: integer
      name:
        example: Web Challenge
        type: string
      points:
        example: 50
        type: integer
      ports:
        example:
        - 10005
        items:
          type: integer
        type: array
      preRequisite:
        example:
        - '[''chall1'''
        - ' chall2]'
        items:
          type: string
        type: array
      previousTries:
        example: 3
        type: integer
      solveStatus:
        example: true
        type: boolean
      solvesNumber:
        example: 100
        type: integer
      tags:
        example:
        - '[''pwn'''
        - '''misc'']'
        items:
          type: string
        type: array
    type: object
  api.ChallengeMetadata:
    properties:
      createdAt:
        type: string
      deployedStatus:
        example: deployed
        type: string
      difficulty:
        example: easy
        type: string
      id:
        example: 0
        type: integer
      instanceExpiration:
        example: 300
        type: integer
      instanced:
        example: false
        type: boolean
      name:
        example: Web Challenge
        type: string
      points:
        example: 50
        type: integer
      preRequisite:
        example:
        - '[''chall1'''
        - ' chall2]'
        items:
          type: string
        type: array
      solveStatus:
        example: true
        type: boolean
      solvesNumber:
        example: 100
        type: integer
      tags:
        example:
        - '[''pwn'''
        - '''misc'']'
        items:
          type: string
        type: array
    type: object
  api.ChallengePreviewResp:
    properties:
      additionalLinks:
        example:
        - '[''http://link1.abc:8080'''
        - '''http://link2.abc:8081'']'
        items:
          type: string
        type: array
      assets:
        example:
        - '[''image1.png'''
        - ' ''zippy.zip'']'
        items:
          type: string
        type: array
      category:
        example: web
        type: string
      deployedLink:
        example: beast.sdslabs.co
        type: string
      description:
        example: A simple web challenge
        type: string
      maxAttemptLimit:
        example: 5
        type: integer
      name:
        example: Web Challenge
        type: string
      points:
        example: 50
        type: integer
      ports:
        example:
        - 3001
        - 3002
        items:
          type: integer
        type: array
      preRequisite:
        example:
        - '[''web-php'''
        - '''simple'']'
        items:
          type: string
        type: array
      tags:
        example:
        - '[''pwn'''
        - '''misc'']'
        items:
          type: string
        type: array
    type: object
  api.ChallengeSolveResp:
    properties:
      category:
        example: bare
        type: string
      id:
        example: 4
        type: integer
      name:
        example: Web Challenge
        type: string
      points:
        example: 50
        type: integer
      solvedAt:
        type: string
      tags:
        example:
        - '[''pwn'''
        - '''misc'']'
        items:
          type: string
        type: array
    type: object
  api.ChallengeStatusResp:
    properties:
      name:
        example: Web Challenge
        type: string
      status:
        example: deployed
        type: string
      updated_at:
        example: "2018-12-31T22:20:08.948096189+05:30"
        type: string
    type: object
  api.ChallengeSubmitResponse:
    properties:
      message:
        example: Your answer is correct
        type: string
      success:
        example: true
        type: boolean
    type: object
  api.CompetitionInfoResp:
    properties:
      about:
        example: This is a CTF competition
        type: string
      ending_time:
        type: string
      logo_url:
        type: string
      name:
        example: fristonio
        type: string
      prizes:
        example: 1st and 2nd place winners will get $10K
        type: string
      starting_time:
        type: string
      timezone:
        example: 'Asia/Calcutta: UTC +05:30'
        type: string
    type: object
  api.FlagSubmitResp:
    properties:
      message:
        example: Your answer is correct
        type: string
      success:
        example: true
        type: boolean
    type: object
  api.HTTPAuthorizeResp:
    properties:
      message:
        example: Response message
        type: string
      role:
        example: author
        type: string
      token:
        example: YOUR_AUTHENTICATION_TOKEN
        type: string
    type: object
  api.HTTPErrorResp:
    properties:
      error:
        example: Error occured while veifying the challenge.
        type: string
    type: object
  api.HTTPPlainResp:
    properties:
      message:
        example: Messsage in response to your request
        type: string
    type: object
  api.HintInfo:
    properties:
      id:
        type: integer
      points:
        type: integer
    type: object
  api.HintResponse:
    properties:
      description:
        example: This is a hint
        type: string
      points:
        example: 10
        type: integer
    type: object
  api.InstanceResponse:
    properties:
      challenge_name:
        type: string
      created_at:
        type: string
      expires_at:
        type: string
      hosted_address:
        type: string
      instance_id:
        type: string
      port:
        items:
          type: integer
        type: array
      ttl_seconds:
        type: integer
    type: object
  api.LogsInfoResp:
    properties:
      stderr:
        example: '[ERROR] Challenge deployment failed.'
        type: string
      stdout:
        example: '[INFO] Challenge is starting to deploy'
        type: string
    type: object
  api.SubmissionResp:
    properties:
      chall_id:
        example: 3
        type: integer
      cheating:
        example: false
        type: boolean
      flag:
        example: flag{@#$}
        type: string
      name:
        example: Web Challenge
        type: string
      solvedAt:
        type: string
      success:
        example: true
        type: boolean
      user_id:
        example: 3
        type: integer
      username:
        example: fristonio
        type: string
    type: object
  api.TagInfoResp:
    properties:
      tags:
        items:
          type: string
        type: array
    type: object
  api.UserCountResp:
    properties:
      user_count:
        type: integer
    type: object
  api.UserResp:
    properties:
      challenges:
        items:
          $ref: '#/definitions/api.ChallengeSolveResp'
        type: array
      email:
        example: fristonio@gmail.com
        type: string
      id:
        example: 5
        type: integer
      rank:
        example: 15
        type: integer
      role:
        example: author
        type: string
      score:
        example: 750
        type: integer
      status:
        example: 0
        type: integer
      username:
        example: CTF is live now!
        type: string
    type: object
  api.UsersResp:
    properties:
      email:
        example: fristonio@gmail.com
        type: string
      id:
        example: 5
        type: integer
      rank:
        example: 15
        type: integer
      role:
        example: author
        type: string
      score:
        example: 750
        type: integer
      status:
        example: 0
        type: integer
      username:
        example: CTF is live now!
        type: string
    type: object
  api.UsersStatisticsResp:
    properties:
      banned_users:
        example: 60
        type: integer
      total_registered_users:
        example: 120
        type: integer
      unbanned_users:
        example: 60
        type: integer
    type: object
  database.TimeSeries:
    properties:
      score:
        example: 750
        type: integer
      timestamp:
        example: "2018-12-31T22:20:08.123+00:00"
        type: string
    type: object
  database.UserLeaderboardResp:
    properties:
      id:
        example: 5
        type: integer
      rank:
        example: 15
        type: integer
      score:
        example: 750
        type: integer
      timeSeriesData:
        items:
          $ref: '#/definitions/database.TimeSeries'
        type: array
      username:
        example: ABCD
        type: string
    type: object
info:
  contact:
    email: contact.sdslabs.co.in
    name: SDSLabs
    url: https://chat.sdslabs.co
  description: Beast the automatic deployment tool for playCTF
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  title: Beast API
  version: "1.0"
paths:
  /api/admin/freezeLeaderboard:
    post:
      description: freezes the user leaderboard on demand.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.HTTPPlainResp'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.HTTPErrorResp'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.HTTPErrorResp'
      security:
      - ApiKeyAuth: []
      summary: Freeze user leaderboard
      tags:
      - info
  /api/admin/instances:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/api.AdminInstanceResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.HTTPPlainResp'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.HTTPErrorResp'
      security:
      - ApiKeyAuth: []
      summary: List all instances as an administrator
      tags:
      - admin
  /api/admin/instances/{instance_id}:
    delete:
      parameters:
      - description: Instance ID
        in: path
        name: instance_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.HTTPPlainResp'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.HTTPPlainResp'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.HTTPErrorResp'
      security:
      - ApiKeyAuth: []
      summary: Delete an instance by ID as an administrator
      tags:
      - admin
    get:
      parameters:
      - description: Instance ID
        in: path
        name: instance_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.AdminInstanceResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.HTTPPlainResp'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.HTTPErrorResp'
      security:
      - ApiKeyAuth: []
      summary: Get an instance by ID as an administrator
      tags:
      - admin
  /api/admin/instances/challenge/{challenge_name}:
    delete:
      parameters:
      - description: Challenge name
        in: path
        name: challenge_name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.HTTPPlainResp'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.HTTPPlainResp'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.HTTPErrorResp'
      security:
      - ApiKeyAuth: []
      summary: Delete a challenge's instances as an administrator
      tags:
      - admin
  /api/admin/instances/user/{user_id}:
    delete:
      parameters:
      - description: Beast user ID
        in: path
        name: user_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.HTTPPlainResp'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.HTTPPlainResp'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.HTTPErrorResp'
      security:
      - ApiKeyAuth: []
      summary: Delete a user's instances as an administrator
      tags:
      - admin
  /api/admin/leaderboard:
    get:
      description: Returns admin leaderboard of all users
      parameters:
      - description: Page number
        in: query
        name: page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/api.UserResp'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.HTTPErrorResp'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.HTTPErrorResp'
      security:
      - ApiKeyAuth: []
      summary: Returns admin leaderboard
      tags:
      - info
  /api/admin/statistics:
    get:
      description: returns statistics of users in competition (currently limited to
        ban/unban status of users)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.UsersStatisticsResp'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.HTTPErrorResp'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.HTTPErrorResp'
      security:
      - ApiKeyAuth: []
      summary: statistics of users in competition
      tags:
      - info
  /api/admin/submissions:
    get:
      description: Handles submissions made by the user
      parameters:
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Use csv to export
        in: query
        name: format
        type: string
      produces:
      - application/json
      - text/csv
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/api.SubmissionResp'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.HTTPErrorResp'
      security:
      - ApiKeyAuth: []
      summary: Handles submissions made by the user
      tags:
      - info
  /api/admin/unfreezeLeaderboard:
    post:
      description: unfreezes the user leaderboard on demand.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.HTTPPlainResp'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.HTTPErrorResp'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.HTTPErrorResp'
      security:
      - ApiKeyAuth: []
      summary: Unfreeze user leaderboard
      tags:
      - info
  /api/admin/users/{action}/{id}:
    post:
      description: Ban/Unban/Hide/Unhide a user based on his user id. This operation
        can only be done by admins
      parameters:
      - description: Action to perform Ban/Unban/Hide/Unhide
        in: path
        name: action
        required: true
        type: string
      - description: Id of user
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.ChallengeStatusResp'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.HTTPPlainResp'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.HTTPPlainResp'
      security:
      - ApiKeyAuth: []
      summary: Ban/Unban/Hide/Unhide a user based on his id and the action provided.
      tags:
      - admin
  /api/check/challenge:
    post:
      consumes:
      - application/x-www-form-urlencoded
      - multipart/form-data
      description: Returns success or error response based on the status of completion.
      parameters:
      - description: ID of challenge
        in: formData
        name: chall_id
        required: true
        type: string
      - description: Instance ID for challenge
        in: formData
        name: instance_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.ChallengeSubmitResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.HTTPErrorResp'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.HTTPErrorResp'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.HTTPErrorResp'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.HTTPErrorResp'
      security:
      - ApiKeyAuth: []
      summary: Verifies and creates an entry in the database for successful submission
        of a challenge.
      tags:
      - Submit
  /api/config/challenge-info:
    post:
      consumes:
      - application/x-www-form-urlencoded
      - multipart/form-data
      description: Updates challenge info in the database, located at ~/.beast/beast.db.
      parameters:
      - description: Challenge Name
        in: formData
        name: name
        required: true
        type: string
      - description: Challenge description. The description field is also accepted.
        in: formData
        name: desc
        type: string
      - description: Challenge's points
        in: formData
        name: points
        type: integer
      - description: Challenge's flag
        in: formData
        name: flag
        type: string
      - description: Challenge's tags
        in: formData
        name: tags
        type: string
      - description: Comma-separated allocated host ports
        in: formData
        name: ports
        type: string
      - description: 'Asset names separated by ::::'
        in: formData
        name: assets
        type: string
      - description: 'Links separated by ::::'
        in: formData
        name: additionalLinks
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.HTTPPlainResp'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.HTTPPlainResp'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.HTTPErrorResp'
      security:
      - ApiKeyAuth: []
      summary: Updates challenge info in the database, located at ~/.beast/beast.db.
      tags:
      - config
  /api/config/competition-info:
    post:
      consumes:
      - application/x-www-form-urlencoded
      - multipart/form-data
      description: Populates beast gobal config map by reparsing the config file $HOME/.beast/config.toml.
      parameters:
      - description: Competition Name
        in: formData
        name: name
        type: string
      - description: Some information about competition
        in: formData
        name: about
        type: string
      - description: Competitions Prizes for the winners
        in: formData
        name: prizes
        type: string
      - description: Competition's starting time
        in: formData
        name: starting_time
        type: string
      - description: Competition's ending time
        in: formData
        name: ending_time
        type: string
      - description: Competition's timezone
        in: formData
        name: timezone
        type: string
      - description: Enable dynamic scoring
        in: formData
        name: dynamic_score
        type: boolean
      - description: Competition's logo
        in: formData
        name: logo
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.HTTPPlainResp'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.HTTPPlainResp'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.HTTPErrorResp'
      security:
      - ApiKeyAuth: []
      summary: Updates competition info in the beast global configuration, located
        at ~/.beast/config.toml.
      tags:
      - config
  /api/config/reload:
    patch:
      description: Populates beast gobal config map by reparsing the config file $HOME/.beast/config.toml.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.HTTPPlainResp'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.HTTPPlainResp'
      security:
      - ApiKeyAuth: []
      summary: Reloads any changes in beast global configuration, located at ~/.beast/config.toml.
      tags:
      - config
  /api/info/challenge/{name}:
    get:
      description: Returns challenge metadata and allocated host ports. For instanced
        challenges, the ports belong to the caller's active instance.
      parameters:
      - description: Name of challenge
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.Challenge'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.HTTPErrorResp'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.HTTPErrorResp'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.HTTPErrorResp'
      security:
      - ApiKeyAuth: []
      summary: Returns all information about the challenges.
      tags:
      - info
  /api/info/challenges:
    get:
      description: Returns information about all the challenges present in the database
        with and without filters.
      parameters:
      - description: Filter parameter by which challenges are filtered
        in: query
        name: filter
        type: string
      - description: Value of filtered parameter
        in: query
        name: value
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/api.ChallengeMetadata'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.HTTPErrorResp'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.HTTPErrorResp'
      security:
      - ApiKeyAuth: []
      summary: Returns metadata about all challenges with and without filters.
      tags:
      - info
  /api/info/competition-info:
    get:
      description: returns various information about the competition which are used
        to control competition
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.CompetitionInfoResp'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.HTTPErrorResp'
      summary: returns competition info
      tags:
      - info
  /api/info/download:
    get:
      parameters:
      - description: Challenge name
        in: query
        name: challenge
